name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# Droits minimaux : la CI peut seulement lire le code.
permissions:
  contents: read

# Si on pousse un nouveau commit, l'ancienne exécution de la même branche est annulée.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valeurs FACTICES : elles suffisent pour prisma validate, lint et build,
  # sans jamais toucher une vraie base de données.
  DATABASE_URL: postgresql://user:password@localhost:5432/ci
  DATABASE_URL_UNPOOLED: postgresql://user:password@localhost:5432/ci
  BETTER_AUTH_SECRET: secret-factice-uniquement-pour-la-ci-0123456789
  BETTER_AUTH_URL: http://localhost:3000

jobs:
  verify:
    name: Verifications
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11   # SUPPRIME cette ligne si package.json contient "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dependances
        run: pnpm install --frozen-lockfile

      - name: Valider le schema Prisma
        run: pnpm exec prisma validate

      - name: Lint
        run: pnpm lint

      - name: Tests unitaires
        run: pnpm test

      - name: Build
        run: pnpm build

  integration-e2e:
    name: Tests integration et e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Une PR venue d'un fork n'a pas accès aux secrets : ce job est alors ignoré.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    # Une seule exécution à la fois sur la base Neon de test, pour éviter les collisions.
    concurrency:
      group: base-neon-de-test
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_TEST }}
      DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11   # SUPPRIME cette ligne si package.json contient "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dependances
        run: pnpm install --frozen-lockfile

      - name: Verifier que le secret de la base de test existe
        run: test -n "$DATABASE_URL_TEST" || (echo "::error::Le secret DATABASE_URL_TEST est manquant" && exit 1)

      - name: Tests d'integration
        run: pnpm test:integration

      - name: Installer le navigateur Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Tests e2e
        run: pnpm test:e2e

      - name: Garder le rapport Playwright en cas d'echec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  audit:
    name: Audit des dependances
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11   # SUPPRIME cette ligne si package.json contient "packageManager"

      # Visible dans les logs, mais ne bloque pas les PR (une faille dans une
      # dépendance n'est pas forcément due à la PR en cours).
      - name: pnpm audit
        run: pnpm audit --prod
        continue-on-error: true