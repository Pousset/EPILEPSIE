# compose.yaml
name: epilepsie-site
services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  studio:
    build:
      context: .
      target: studio
    ports:
      - "51212:51212"
    env_file:
      - .env
    restart: unless-stopped
